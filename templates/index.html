<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EZE EKWENSU | Sovereign Oracle</title>
    <style>
        :root { --bg: #050505; --panel: #111; --border: #333; --cyan: #00e5ff; --green: #00ff88; --magenta: #ff00ff; --text: #ccc; }
        
        /* ELITE FIX: 100dvh guarantees the UI fits inside mobile browser constraints perfectly */
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100dvh; display: flex; flex-direction: row; overflow: hidden; }
        
        /* SIDEBAR */
        .sidebar { width: 280px; height: 100dvh; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 1000; transition: transform 0.3s ease; flex-shrink: 0; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); text-align: center; flex-shrink: 0; }
        .sidebar-header h2 { margin: 0; color: var(--green); font-size: 14px; letter-spacing: 2px; }
        .new-chat-btn { margin: 15px; background: transparent; border: 1px dashed var(--cyan); color: var(--cyan); padding: 10px; cursor: pointer; font-weight: bold; border-radius: 4px; transition: 0.3s; flex-shrink: 0; }
        .new-chat-btn:hover { background: rgba(0, 229, 255, 0.1); }
        .chat-list { flex: 1; overflow-y: auto; padding: 10px; }
        .chat-item { padding: 12px; margin-bottom: 8px; background: #1a1a1a; border-radius: 4px; cursor: pointer; font-size: 13px; border-left: 3px solid transparent; display: flex; justify-content: space-between; align-items: center; }
        .chat-item:hover { background: #222; }
        .chat-item.active { border-left-color: var(--green); background: #222; color: #fff; font-weight: bold; }
        .delete-session-btn { color: #ff0033; background: none; border: none; cursor: pointer; font-weight: bold; display: none; }
        .chat-item:hover .delete-session-btn { display: block; }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 999; }

        /* MAIN TERMINAL */
        .main { flex: 1; display: flex; flex-direction: column; height: 100dvh; position: relative; min-width: 0; }
        
        .mobile-header { display: none; background: #002233; padding: 15px 20px; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--cyan); flex-shrink: 0; }
        .mobile-header h1 { margin: 0; color: var(--cyan); font-size: 16px; letter-spacing: 2px; }
        .hamburger { background: none; border: none; color: var(--green); font-size: 24px; cursor: pointer; }

        .chat-window { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        
        .message-wrapper { display: flex; flex-direction: column; max-width: 85%; }
        .msg-user-wrapper { align-self: flex-end; align-items: flex-end; }
        .msg-ai-wrapper { align-self: flex-start; align-items: flex-start; }
        
        .message { padding: 15px; border-radius: 8px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; position: relative; word-wrap: break-word; }
        .msg-user { background: #002233; border: 1px solid var(--cyan); color: #fff; }
        .msg-ai { background: #1a1a1a; border-left: 3px solid var(--magenta); color: #ddd; box-shadow: 5px 5px 15px rgba(0,0,0,0.5); }
        .msg-sys { align-self: center; background: transparent; color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; text-align: center; }

        .msg-controls { display: flex; gap: 10px; margin-top: 5px; opacity: 0; transition: opacity 0.2s; }
        .message-wrapper:hover .msg-controls { opacity: 1; }
        .ctrl-btn { background: none; border: none; color: #888; font-size: 11px; cursor: pointer; padding: 0; }
        .ctrl-btn:hover { color: var(--green); }
        .ctrl-btn.del:hover { color: #ff0033; }
        .ctrl-btn.branch:hover { color: var(--cyan); }

        /* CONSOLE STAGING AREA */
        .bottom-console { background: var(--panel); border-top: 1px solid var(--border); display: flex; flex-direction: column; width: 100%; flex-shrink: 0; }
        .file-queue-container { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px 15px 0 15px; }
        .queued-file { background: #222; border: 1px solid var(--cyan); color: #ccc; padding: 5px 10px; border-radius: 15px; font-size: 11px; display: flex; align-items: center; gap: 8px; }
        .queued-file-remove { color: #ff0033; cursor: pointer; font-weight: bold; font-size: 12px; }
        
        .input-area { padding: 15px; display: flex; gap: 10px; align-items: flex-end; width: 100%; box-sizing: border-box; }
        .upload-btn { background: #222; border: 1px solid var(--border); color: var(--cyan); padding: 10px; border-radius: 8px; cursor: pointer; height: 50px; min-width: 50px; display: flex; align-items: center; justify-content: center; font-size: 20px; transition: 0.3s; }
        .upload-btn:hover { border-color: var(--cyan); }
        
        textarea { flex: 1; background: #1a1a1a; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 8px; font-family: inherit; font-size: 14px; resize: none; outline: none; transition: 0.3s; height: 24px; max-height: 120px; overflow-y: auto; box-sizing: border-box; }
        textarea:focus { border-color: var(--green); }
        
        .send-btn { background: var(--green); color: #000; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; height: 50px; display: flex; align-items: center; justify-content: center; }
        .send-btn:hover { background: #00cc6a; }
        .send-btn:disabled { background: #444; color: #888; cursor: not-allowed; }
        
        .loading { color: var(--cyan); font-size: 12px; font-weight: bold; display: none; padding: 10px; align-self: flex-start; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        /* ELITE MOBILE RESPONSIVENESS */
        @media (max-width: 768px) {
            .mobile-header { display: flex; }
            .sidebar { position: absolute; left: -300px; } /* Changed to absolute for smoother slide */
            .sidebar.open { left: 0; }
            .sidebar-overlay.open { display: block; }
            .message-wrapper { max-width: 95%; }
            .msg-controls { opacity: 1; } 
            .delete-session-btn { display: block; } 
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>EZE EKWENSU</h2>
            <div style="font-size: 10px; color: #555; margin-top: 5px;">MULTIVERSE TERMINAL v6.3</div>
        </div>
        <button class="new-chat-btn" onclick="createNewBranch(); if(window.innerWidth <= 768) toggleSidebar();">+ NEW COGNITIVE BRANCH</button>
        <div class="chat-list" id="chatList"></div>
    </div>

    <div class="main">
        <div class="mobile-header">
            <h1>EZE EKWENSU</h1>
            <button class="hamburger" onclick="toggleSidebar()">☰</button>
        </div>

        <div class="chat-window" id="chatWindow">
            <div class="msg-sys">Sovereign Matrix Initialized. All communications encrypted.</div>
        </div>
        
        <div class="loading" id="loadingIndicator">⟳ ORCHESTRATOR WAKING THE SWARM...</div>
        
        <div class="bottom-console">
            <div class="file-queue-container" id="fileQueue"></div>
            <div class="input-area">
                <input type="file" id="fileInput" multiple style="display: none;" onchange="queueFiles(event)">
                <button class="upload-btn" onclick="document.getElementById('fileInput').click()">📎</button>
                <textarea id="promptInput" placeholder="Command..." oninput="autoResize(this)" onkeydown="handleEnter(event)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendPayload()">EXECUTE</button>
            </div>
        </div>
    </div>

    <script>
        let currentBranchId = null;
        let sessions = JSON.parse(localStorage.getItem('omni_sessions')) || {};
        let pendingFilesArray = [];

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('open');
        }

        function saveSessions() { localStorage.setItem('omni_sessions', JSON.stringify(sessions)); }

        function createNewBranch() {
            const branchId = 'branch_' + Date.now();
            sessions[branchId] = { title: 'New Sector Protocol', messages: [] };
            saveSessions(); switchBranch(branchId);
        }

        function switchBranch(branchId) {
            currentBranchId = branchId;
            renderSidebar(); renderChat();
            if(window.innerWidth <= 768) toggleSidebar(); 
        }

        function deleteSession(event, branchId) {
            event.stopPropagation(); delete sessions[branchId]; saveSessions();
            if(currentBranchId === branchId) {
                currentBranchId = Object.keys(sessions)[0] || null;
                if(!currentBranchId) createNewBranch(); else switchBranch(currentBranchId);
            } else renderSidebar();
        }

        function renderSidebar() {
            const list = document.getElementById('chatList'); list.innerHTML = '';
            Object.keys(sessions).reverse().forEach(id => {
                const isActive = id === currentBranchId ? 'active' : '';
                list.innerHTML += `<div class="chat-item ${isActive}" onclick="switchBranch('${id}')"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${sessions[id].title}</span><button class="delete-session-btn" onclick="deleteSession(event, '${id}')">✕</button></div>`;
            });
        }

        function renderChat() {
            const win = document.getElementById('chatWindow');
            win.innerHTML = '<div class="msg-sys">Sovereign Matrix Initialized. All communications encrypted locally.</div>';
            if(currentBranchId && sessions[currentBranchId]) {
                sessions[currentBranchId].messages.forEach((msg, index) => {
                    const wrapperClass = msg.role === 'user' ? 'msg-user-wrapper' : 'msg-ai-wrapper';
                    const msgClass = msg.role === 'user' ? 'msg-user' : 'msg-ai';
                    win.innerHTML += `
                        <div class="message-wrapper ${wrapperClass}">
                            <div class="message ${msgClass}" id="msg-${index}">${msg.content}</div>
                            <div class="msg-controls">
                                <button class="ctrl-btn" onclick="copyMsg(${index})">📋 Copy</button>
                                <button class="ctrl-btn" onclick="editMsg(${index})">✎ Edit</button>
                                <button class="ctrl-btn del" onclick="deleteMsg(${index})">🗑 Delete</button>
                                <button class="ctrl-btn branch" onclick="branchFromHere(${index})">⎇ Branch</button>
                            </div>
                        </div>
                    `;
                });
            }
            scrollToBottom();
        }

        window.branchFromHere = function(index) {
            const newBranchId = 'branch_' + Date.now();
            const clonedMessages = JSON.parse(JSON.stringify(sessions[currentBranchId].messages.slice(0, index + 1)));
            sessions[newBranchId] = { title: "Branch of: " + sessions[currentBranchId].title.substring(0, 15), messages: clonedMessages };
            saveSessions(); switchBranch(newBranchId);
        }

        window.copyMsg = function(index) { navigator.clipboard.writeText(sessions[currentBranchId].messages[index].content); }
        window.deleteMsg = function(index) { sessions[currentBranchId].messages.splice(index, 1); saveSessions(); renderChat(); }
        window.editMsg = function(index) {
            const newText = prompt("Edit message:", sessions[currentBranchId].messages[index].content);
            if(newText !== null && newText.trim() !== "") { sessions[currentBranchId].messages[index].content = newText; saveSessions(); renderChat(); }
        }

        window.queueFiles = function(event) {
            const files = event.target.files;
            for(let i=0; i < files.length; i++) pendingFilesArray.push(files[i]);
            renderFileQueue(); event.target.value = ''; 
        }

        function renderFileQueue() {
            const queueDiv = document.getElementById('fileQueue'); queueDiv.innerHTML = '';
            pendingFilesArray.forEach((file, index) => {
                queueDiv.innerHTML += `<div class="queued-file">📄 ${file.name} <span class="queued-file-remove" onclick="removeQueuedFile(${index})">✕</span></div>`;
            });
        }

        window.removeQueuedFile = function(index) { pendingFilesArray.splice(index, 1); renderFileQueue(); }
        function scrollToBottom() { const win = document.getElementById('chatWindow'); win.scrollTop = win.scrollHeight; }
        function autoResize(el) { el.style.height = '24px'; el.style.height = (el.scrollHeight) + 'px'; }
        function handleEnter(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendPayload(); } }

        async function sendPayload() {
            const input = document.getElementById('promptInput');
            const text = input.value.trim();
            if(!text && pendingFilesArray.length === 0) return;

            if(sessions[currentBranchId].messages.length === 0 && text) {
                sessions[currentBranchId].title = text.substring(0, 25) + "...";
                renderSidebar();
            }

            let uiMessage = text;
            if (pendingFilesArray.length > 0) {
                const fileNames = pendingFilesArray.map(f => f.name).join(', ');
                uiMessage += `\n\n[📎 Attached: ${fileNames}]`;
            }

            sessions[currentBranchId].messages.push({ role: 'user', content: uiMessage });
            saveSessions(); renderChat();
            
            input.value = ''; autoResize(input);
            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('sendBtn').disabled = true;

            const formData = new FormData();
            formData.append('prompt', text);
            pendingFilesArray.forEach(file => { formData.append('files', file); });
            pendingFilesArray = []; renderFileQueue();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    body: formData 
                });
                
                // ELITE FIX: Diagnostic Error Handling
                if (!response.ok) {
                    throw new Error(`Server Response: ${response.status}`);
                }
                
                const data = await response.json();
                sessions[currentBranchId].messages.push({ role: 'ai', content: data.response });
                saveSessions(); renderChat();
                
            } catch (error) {
                sessions[currentBranchId].messages.push({ role: 'ai', content: `[FATAL ERROR] Connection severed. Details: ${error.message}\n\n*Fix: The cloud server timed out during deep reasoning. We extended the Gunicorn timeout to 300s.*` });
                saveSessions(); renderChat();
            }

            document.getElementById('loadingIndicator').style.display = 'none';
            document.getElementById('sendBtn').disabled = false;
        }

        if(Object.keys(sessions).length === 0) createNewBranch();
        else switchBranch(Object.keys(sessions)[Object.keys(sessions).length - 1]);
    </script>
</body>
</html>
